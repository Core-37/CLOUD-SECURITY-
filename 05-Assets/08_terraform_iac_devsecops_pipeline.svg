<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%" style="background-color:#0b0f19; font-family:'Segoe UI', Roboto, Arial, sans-serif;">
  <defs>
    <marker id="aC" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#22d3ee"/></marker>
    <marker id="aE" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#34d399"/></marker>
  </defs>

  <!-- Header -->
  <rect x="25" y="18" width="1150" height="78" rx="14" fill="#131b2e" stroke="#1e293b" stroke-width="2"/>
  <text x="50" y="52" font-size="22" font-weight="bold" fill="#22d3ee">⚙️ КОНВЕЙЕР DEVSECOPS И TERRAFORM (IAC): «БЕЗОПАСНОСТЬ ВЛЕВО» (SHIFT-LEFT)</text>
  <text x="50" y="78" font-size="13.5" fill="#94a3b8">Почему CISO Marius Poskus требует знать Terraform и автоматические сканеры вместо ручного кликанья в консоли</text>

  <!-- Pipeline Track -->
  <rect x="25" y="114" width="1150" height="330" rx="14" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="50" y="144" font-size="15" font-weight="bold" fill="#fde047">🛤️ ПУТЬ КОДА ОТ НОУТБУКА РАЗРАБОТЧИКА ДО ОБЛАКА (ЗАЩИТА НА КАЖДОМ ЭТАПЕ):</text>

  <!-- Stage 1 -->
  <g transform="translate(42, 168)">
    <rect width="190" height="245" rx="10" fill="#111827" stroke="#38bdf8" stroke-width="2"/>
    <rect x="12" y="12" width="166" height="30" rx="6" fill="#0284c7"/>
    <text x="95" y="32" font-size="12.5" font-weight="bold" fill="#fff" text-anchor="middle">1. КОД (IDE / Git)</text>
    <text x="14" y="64" font-size="12" font-weight="bold" fill="#7dd3fc">Пишем облако кодом:</text>
    <text x="14" y="84" font-family="monospace" font-size="11" fill="#cbd5e1">main.tf (Terraform)</text>
    <text x="14" y="102" font-family="monospace" font-size="11" fill="#cbd5e1">Dockerfile</text>
    <text x="14" y="120" font-family="monospace" font-size="11" fill="#cbd5e1">k8s-deploy.yaml</text>
    <text x="14" y="150" font-size="11.5" fill="#34d399">✔ Pre-commit hook:</text>
    <text x="14" y="170" font-size="12" font-weight="bold" fill="#fde047">Gitleaks / TruffleHog</text>
    <text x="14" y="190" font-size="11" fill="#cbd5e1">Остановит commit, если</text>
    <text x="14" y="206" font-size="11" fill="#cbd5e1">ты случайно оставил</text>
    <text x="14" y="222" font-size="11" fill="#f87171">AKIA... ключ в коде!</text>
  </g>

  <line x1="234" y1="290" x2="262" y2="290" stroke="#22d3ee" stroke-width="3" marker-end="url(#aC)"/>

  <!-- Stage 2 -->
  <g transform="translate(266, 168)">
    <rect width="205" height="245" rx="10" fill="#111827" stroke="#a855f7" stroke-width="2"/>
    <rect x="12" y="12" width="181" height="30" rx="6" fill="#7e22ce"/>
    <text x="102" y="32" font-size="12.5" font-weight="bold" fill="#fff" text-anchor="middle">2. IaC СКАН (PR)</text>
    <text x="14" y="64" font-size="12" font-weight="bold" fill="#d8b4fe">Проверка до запуска!</text>
    <text x="14" y="88" font-size="12.5" font-weight="bold" fill="#fde047">Checkov / tfsec</text>
    <text x="14" y="110" font-size="11" fill="#cbd5e1">Читает <tspan font-family="monospace">main.tf</tspan> и</text>
    <text x="14" y="128" font-size="11" fill="#cbd5e1">блокирует Pull Request,</text>
    <text x="14" y="146" font-size="11" fill="#cbd5e1">если найдены дыры:</text>
    <text x="14" y="170" font-size="11" fill="#f87171">• S3 без Block Public</text>
    <text x="14" y="188" font-size="11" fill="#f87171">• SSH 0.0.0.0/0</text>
    <text x="14" y="206" font-size="11" fill="#f87171">• Нет шифрования EBS</text>
    <text x="14" y="228" font-family="monospace" font-size="10.5" fill="#34d399">$ checkov -d .</text>
  </g>

  <line x1="473" y1="290" x2="501" y2="290" stroke="#22d3ee" stroke-width="3" marker-end="url(#aC)"/>

  <!-- Stage 3 -->
  <g transform="translate(505, 168)">
    <rect width="205" height="245" rx="10" fill="#111827" stroke="#ec4899" stroke-width="2"/>
    <rect x="12" y="12" width="181" height="30" rx="6" fill="#be185d"/>
    <text x="102" y="32" font-size="12.5" font-weight="bold" fill="#fff" text-anchor="middle">3. СБОРКА И ОБРАЗЫ</text>
    <text x="14" y="64" font-size="12" font-weight="bold" fill="#f9a8d4">SAST + Container Scan:</text>
    <text x="14" y="88" font-size="12.5" font-weight="bold" fill="#fde047">Semgrep + Trivy</text>
    <text x="14" y="110" font-size="11" fill="#cbd5e1">• Semgrep ищет SQLi/SSRF</text>
    <text x="14" y="128" font-size="11" fill="#cbd5e1">  в коде на Python/JS/Go</text>
    <text x="14" y="150" font-size="11" fill="#cbd5e1">• Trivy проверяет Docker-</text>
    <text x="14" y="168" font-size="11" fill="#cbd5e1">  образ на старые CVE и</text>
    <text x="14" y="186" font-size="11" fill="#cbd5e1">  библиотеки (SBOM)</text>
    <text x="14" y="212" font-size="11" fill="#34d399">Упало с Critical CVE?</text>
    <text x="14" y="228" font-family="monospace" font-size="10.5" fill="#f87171">CI/CD БЛОКИРУЕТ РЕЛИЗ!</text>
  </g>

  <line x1="712" y1="290" x2="740" y2="290" stroke="#22d3ee" stroke-width="3" marker-end="url(#aC)"/>

  <!-- Stage 4 -->
  <g transform="translate(744, 168)">
    <rect width="195" height="245" rx="10" fill="#111827" stroke="#f59e0b" stroke-width="2"/>
    <rect x="12" y="12" width="171" height="30" rx="6" fill="#d97706"/>
    <text x="97" y="32" font-size="12.5" font-weight="bold" fill="#fff" text-anchor="middle">4. ДЕПЛОЙ (OIDC)</text>
    <text x="14" y="64" font-size="12" font-weight="bold" fill="#fcd34d">Безопасная выкладка:</text>
    <text x="14" y="88" font-family="monospace" font-size="11" fill="#38bdf8">terraform apply</text>
    <text x="14" y="114" font-size="11" fill="#cbd5e1">• GitHub Actions входит</text>
    <text x="14" y="132" font-size="11" fill="#cbd5e1">  в облако по <tspan font-weight="bold" fill="#34d399">OIDC</tspan> (без</text>
    <text x="14" y="150" font-size="11" fill="#cbd5e1">  вечных Access Key!)</text>
    <text x="14" y="176" font-size="11" fill="#cbd5e1">• Файл <tspan font-family="monospace" fill="#fde047">terraform.tfstate</tspan></text>
    <text x="14" y="194" font-size="11" fill="#cbd5e1">  хранится в закрытом</text>
    <text x="14" y="212" font-size="11" fill="#cbd5e1">  зашифрованном S3</text>
    <text x="14" y="228" font-size="11" fill="#f87171">  (НЕ на GitHub!)</text>
  </g>

  <line x1="941" y1="290" x2="969" y2="290" stroke="#34d399" stroke-width="3" marker-end="url(#aE)"/>

  <!-- Stage 5 -->
  <g transform="translate(973, 168)">
    <rect width="185" height="245" rx="10" fill="#06281e" stroke="#10b981" stroke-width="2"/>
    <rect x="12" y="12" width="161" height="30" rx="6" fill="#059669"/>
    <text x="92" y="32" font-size="12.5" font-weight="bold" fill="#fff" text-anchor="middle">5. КОНТРОЛЬ (CSPM)</text>
    <text x="14" y="64" font-size="12" font-weight="bold" fill="#6ee7b7">Живой аудит облака:</text>
    <text x="14" y="88" font-size="12.5" font-weight="bold" fill="#fde047">Prowler / AWS Config</text>
    <text x="14" y="110" font-size="11" fill="#cbd5e1">• Ищет «ручные правки»</text>
    <text x="14" y="128" font-size="11" fill="#cbd5e1">  (Configuration Drift)</text>
    <text x="14" y="150" font-size="11" fill="#cbd5e1">• Проверяет 300+ правил</text>
    <text x="14" y="168" font-size="11" fill="#cbd5e1">  CIS Benchmark</text>
    <text x="14" y="196" font-family="monospace" font-size="10.5" fill="#34d399">$ prowler aws</text>
    <text x="14" y="218" font-size="11" fill="#a7f3d0">Ошибки летят в Slack</text>
    <text x="14" y="232" font-size="11" fill="#a7f3d0">или чинятся авто!</text>
  </g>

  <!-- Bottom: Real Terraform Example Bad vs Good -->
  <rect x="25" y="465" width="1150" height="275" rx="12" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="50" y="496" font-size="15.5" font-weight="bold" fill="#38bdf8">📝 РЕАЛЬНЫЙ ПРИМЕР В TERRAFORM: КАК ОДНА ОПЕЧАТКА ОТКРЫВАЕТ СЕРВЕР ВСЕМ ХАКЕРАМ</text>

  <rect x="45" y="512" width="540" height="210" rx="10" fill="#1a0d10" stroke="#ef4444"/>
  <text x="65" y="538" font-size="13.5" font-weight="bold" fill="#fca5a5">❌ ОПАСНО (Checkov остановит этот код — CKV_AWS_24):</text>
  <text x="65" y="564" font-family="monospace" font-size="12" fill="#cbd5e1">resource "aws_security_group" "web_sg" {</text>
  <text x="65" y="584" font-family="monospace" font-size="12" fill="#cbd5e1">  ingress {</text>
  <text x="65" y="604" font-family="monospace" font-size="12" fill="#cbd5e1">    from_port   = <tspan fill="#fde047">22</tspan>   <tspan fill="#64748b"># Порт админки SSH!</tspan></text>
  <text x="65" y="624" font-family="monospace" font-size="12" fill="#cbd5e1">    to_port     = 22</text>
  <text x="65" y="644" font-family="monospace" font-size="12" fill="#cbd5e1">    protocol    = "tcp"</text>
  <text x="65" y="664" font-family="monospace" font-size="12" fill="#f87171">    cidr_blocks = ["0.0.0.0/0"] <tspan fill="#fca5a5"># ОТКРЫТО ВСЕМУ МИРУ!</tspan></text>
  <text x="65" y="684" font-family="monospace" font-size="12" fill="#cbd5e1">  }</text>
  <text x="65" y="704" font-family="monospace" font-size="12" fill="#cbd5e1">}</text>

  <rect x="615" y="512" width="540" height="210" rx="10" fill="#071a14" stroke="#10b981"/>
  <text x="635" y="538" font-size="13.5" font-weight="bold" fill="#6ee7b7">✅ БЕЗОПАСНО (Либо только IP офиса, либо AWS SSM без SSH!):</text>
  <text x="635" y="564" font-family="monospace" font-size="12" fill="#cbd5e1">resource "aws_security_group" "web_sg" {</text>
  <text x="635" y="584" font-family="monospace" font-size="12" fill="#cbd5e1">  description = "HTTPS traffic via ALB only"</text>
  <text x="635" y="604" font-family="monospace" font-size="12" fill="#cbd5e1">  ingress {</text>
  <text x="635" y="624" font-family="monospace" font-size="12" fill="#cbd5e1">    from_port       = <tspan fill="#34d399">443</tspan></text>
  <text x="635" y="644" font-family="monospace" font-size="12" fill="#cbd5e1">    to_port         = 443</text>
  <text x="635" y="664" font-family="monospace" font-size="12" fill="#34d399">    security_groups = [aws_security_group.alb.id]</text>
  <text x="635" y="684" font-family="monospace" font-size="12" fill="#cbd5e1">  } <tspan fill="#94a3b8"># Для входа админов — AWS Session Manager (без порта 22!)</tspan></text>
  <text x="635" y="704" font-family="monospace" font-size="12" fill="#cbd5e1">}</text>
</svg>
