<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%" style="background-color:#0b0f19; font-family:'Segoe UI', Roboto, Arial, sans-serif;">
  <defs>
    <marker id="aB9" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/></marker>
    <marker id="aG9" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#34d399"/></marker>
  </defs>

  <!-- Header -->
  <rect x="25" y="18" width="1150" height="78" rx="14" fill="#131b2e" stroke="#1e293b" stroke-width="2"/>
  <text x="50" y="52" font-size="22" font-weight="bold" fill="#34d399">📡 ОБЛАЧНЫЙ SIEM, МОНИТОРИНГ И АВТО-РЕАКЦИЯ НА ИНЦИДЕНТЫ (CLOUD BLUE TEAM)</text>
  <text x="50" y="78" font-size="13.5" fill="#94a3b8">Как в облаке обнаруживают украденный ключ за секунды и изолируют сервер без участия человека (SOAR)</text>

  <!-- Step 1: Hacker Action -->
  <g transform="translate(25, 118)">
    <rect width="215" height="335" rx="12" fill="#1a0e13" stroke="#ef4444" stroke-width="2"/>
    <rect x="12" y="14" width="191" height="30" rx="6" fill="#dc2626"/>
    <text x="107" y="34" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">1. ДЕЙСТВИЕ ХАКЕРА</text>
    <text x="107" y="70" font-size="26" text-anchor="middle">🕵️</text>
    <text x="16" y="104" font-size="12.5" font-weight="bold" fill="#fca5a5">Аномальный API-вызов:</text>
    <text x="16" y="128" font-size="11.5" fill="#cbd5e1">Хакер украл ключи роли</text>
    <text x="16" y="146" font-size="11.5" fill="#cbd5e1">EC2 (с сервера в Лондоне),</text>
    <text x="16" y="164" font-size="11.5" fill="#cbd5e1">использует их с домашнего</text>
    <text x="16" y="182" font-size="11.5" fill="#cbd5e1">IP в другой стране или Tor:</text>
    <rect x="14" y="200" width="187" height="65" rx="6" fill="#090d16" stroke="#f87171"/>
    <text x="20" y="220" font-family="monospace" font-size="10.5" fill="#fde047">aws iam create-user</text>
    <text x="20" y="238" font-family="monospace" font-size="10.5" fill="#fde047">aws cloudtrail stop-log</text>
    <text x="20" y="256" font-family="monospace" font-size="10.5" fill="#f87171">aws s3 ls s3://secrets</text>
    <text x="16" y="294" font-size="11.5" fill="#94a3b8">В облаке КАЖДЫЙ клик и</text>
    <text x="16" y="312" font-size="11.5" fill="#94a3b8">команда — это API-запрос!</text>
  </g>

  <line x1="242" y1="285" x2="268" y2="285" stroke="#38bdf8" stroke-width="3" marker-end="url(#aB9)"/>

  <!-- Step 2: Telemetry & Logs -->
  <g transform="translate(272, 118)">
    <rect width="215" height="335" rx="12" fill="#111827" stroke="#3b82f6" stroke-width="2"/>
    <rect x="12" y="14" width="191" height="30" rx="6" fill="#2563eb"/>
    <text x="107" y="34" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">2. КАМЕРЫ И ЛОГИ</text>
    <text x="16" y="70" font-size="12.5" font-weight="bold" fill="#93c5fd">📹 AWS CloudTrail</text>
    <text x="16" y="90" font-size="11.5" fill="#cbd5e1">Записывает: КТО, КОГДА,</text>
    <text x="16" y="108" font-size="11.5" fill="#cbd5e1">С КАКОГО IP и ЧТО сделал.</text>
    <text x="16" y="128" font-size="11" fill="#34d399">(Аналог: Azure Activity Log)</text>

    <text x="16" y="160" font-size="12.5" font-weight="bold" fill="#93c5fd">🌐 VPC Flow Logs</text>
    <text x="16" y="180" font-size="11.5" fill="#cbd5e1">Метаданные всех сетевых</text>
    <text x="16" y="198" font-size="11.5" fill="#cbd5e1">пакетов (Accept / Reject).</text>

    <text x="16" y="230" font-size="12.5" font-weight="bold" fill="#93c5fd">🔍 DNS Query Logs</text>
    <text x="16" y="250" font-size="11.5" fill="#cbd5e1">Ловит майнеры и связь</text>
    <text x="16" y="268" font-size="11.5" fill="#cbd5e1">сервера с C2-доменами.</text>

    <text x="16" y="302" font-size="11" fill="#fde047">🛡️ Защита логов: шифр KMS</text>
    <text x="16" y="318" font-size="11" fill="#fde047">+ Log File Validation + ObjectLock</text>
  </g>

  <line x1="489" y1="285" x2="515" y2="285" stroke="#38bdf8" stroke-width="3" marker-end="url(#aB9)"/>

  <!-- Step 3: Threat Detection -->
  <g transform="translate(519, 118)">
    <rect width="215" height="335" rx="12" fill="#111827" stroke="#f59e0b" stroke-width="2"/>
    <rect x="12" y="14" width="191" height="30" rx="6" fill="#d97706"/>
    <text x="107" y="34" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">3. УМНЫЙ ДЕТЕКТОР</text>
    <text x="16" y="70" font-size="12.5" font-weight="bold" fill="#fcd34d">🚨 Amazon GuardDuty</text>
    <text x="16" y="90" font-size="11.5" fill="#cbd5e1">(Azure Defender for Cloud)</text>
    <text x="16" y="114" font-size="11.5" fill="#cbd5e1">Анализирует CloudTrail, VPC</text>
    <text x="16" y="132" font-size="11.5" fill="#cbd5e1">и DNS через ML + Threat Intel.</text>

    <rect x="14" y="150" width="187" height="105" rx="6" fill="#1a140a" stroke="#f59e0b"/>
    <text x="22" y="172" font-size="11.5" font-weight="bold" fill="#fbbf24">Тревога (Severity: HIGH):</text>
    <text x="22" y="192" font-family="monospace" font-size="10.2" fill="#fca5a5">UnauthorizedAccess:</text>
    <text x="22" y="208" font-family="monospace" font-size="10.2" fill="#fca5a5">IAMUser/InstanceCred</text>
    <text x="22" y="224" font-family="monospace" font-size="10.2" fill="#fca5a5">Exfiltration.OutsideAWS</text>
    <text x="22" y="244" font-size="10.5" fill="#cbd5e1">«Ключ EC2 утек наружу!»</text>

    <text x="16" y="284" font-size="11.5" fill="#cbd5e1">Событие тут же летит в</text>
    <text x="16" y="302" font-size="11.5" font-weight="bold" fill="#38bdf8">Security Hub / Sentinel SIEM</text>
    <text x="16" y="320" font-size="11" fill="#94a3b8">(единое окно тревог SOC)</text>
  </g>

  <line x1="736" y1="285" x2="762" y2="285" stroke="#34d399" stroke-width="3" marker-end="url(#aG9)"/>

  <!-- Step 4: SIEM & Correlation -->
  <g transform="translate(766, 118)">
    <rect width="195" height="335" rx="12" fill="#111827" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="12" y="14" width="171" height="30" rx="6" fill="#7c3aed"/>
    <text x="97" y="34" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">4. ПУЛЬТ SIEM</text>
    <text x="16" y="70" font-size="12.5" font-weight="bold" fill="#d8b4fe">📊 Security Hub /</text>
    <text x="16" y="88" font-size="12.5" font-weight="bold" fill="#d8b4fe">Microsoft Sentinel</text>
    <text x="16" y="114" font-size="11.5" fill="#cbd5e1">Сводит тревоги от:</text>
    <text x="16" y="134" font-size="11.5" fill="#cbd5e1">• GuardDuty (угрозы)</text>
    <text x="16" y="152" font-size="11.5" fill="#cbd5e1">• Prowler / Inspector</text>
    <text x="16" y="170" font-size="11.5" fill="#cbd5e1">• Macie (поиск PII в S3)</text>
    <text x="16" y="198" font-size="11.5" fill="#38bdf8">Язык охоты в Sentinel:</text>
    <rect x="14" y="210" width="167" height="58" rx="6" fill="#090d16" stroke="#6366f1"/>
    <text x="20" y="228" font-family="monospace" font-size="10" fill="#a5b4fc">SigninLogs</text>
    <text x="20" y="244" font-family="monospace" font-size="10" fill="#a5b4fc">| where ResultType != 0</text>
    <text x="20" y="260" font-family="monospace" font-size="10" fill="#a5b4fc">| summarize count() by IP</text>
    <text x="16" y="298" font-size="11.5" fill="#cbd5e1">Алерт в Slack / PagerDuty</text>
    <text x="16" y="316" font-size="11.5" fill="#34d399">+ Триггер авто-защиты!</text>
  </g>

  <line x1="963" y1="285" x2="989" y2="285" stroke="#34d399" stroke-width="3" marker-end="url(#aG9)"/>

  <!-- Step 5: SOAR Auto-Remediation -->
  <g transform="translate(993, 118)">
    <rect width="182" height="335" rx="12" fill="#06281e" stroke="#10b981" stroke-width="2.5"/>
    <rect x="12" y="14" width="158" height="30" rx="6" fill="#059669"/>
    <text x="91" y="34" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">5. АВТО-ОТВЕТ</text>
    <text x="91" y="70" font-size="24" text-anchor="middle">⚡</text>
    <text x="14" y="98" font-size="12" font-weight="bold" fill="#6ee7b7">EventBridge + Lambda</text>
    <text x="14" y="118" font-size="11" fill="#cbd5e1">(Azure Logic Apps)</text>
    <text x="14" y="144" font-size="11.5" font-weight="bold" fill="#fff">За 3 секунды само:</text>
    <text x="14" y="166" font-size="11" fill="#a7f3d0">1. Отзывает украден-</text>
    <text x="14" y="182" font-size="11" fill="#a7f3d0">   ные сессии роли!</text>
    <text x="14" y="204" font-size="11" fill="#a7f3d0">2. Меняет SG сервера</text>
    <text x="14" y="220" font-size="11" fill="#a7f3d0">   на «Карантин» (0</text>
    <text x="14" y="236" font-size="11" fill="#a7f3d0">   входа/выхода).</text>
    <text x="14" y="258" font-size="11" fill="#a7f3d0">3. Делает Snapshot</text>
    <text x="14" y="274" font-size="11" fill="#a7f3d0">   диска для форензики.</text>
    <text x="14" y="306" font-size="11.5" font-weight="bold" fill="#fde047">Хакер отрезан</text>
    <text x="14" y="322" font-size="11.5" font-weight="bold" fill="#fde047">до утечки базы!</text>
  </g>

  <!-- Bottom: Incident Response Playbook -->
  <rect x="25" y="472" width="1150" height="268" rx="12" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="50" y="504" font-size="16" font-weight="bold" fill="#fbbf24">📘 ЧЕК-ЛИСТ ДЕЙСТВИЙ SOC-АНАЛИТИКА ПРИ УТЕЧКЕ AWS ACCESS KEY (ВОПРОС НА СОБЕСЕДОВАНИИ!):</text>

  <rect x="45" y="524" width="350" height="196" rx="10" fill="#0d1424" stroke="#38bdf8"/>
  <text x="65" y="550" font-size="13.5" font-weight="bold" fill="#38bdf8">1. Сдержать (Containment)</text>
  <text x="65" y="574" font-size="12" fill="#cbd5e1">• НЕ удаляй ключ сразу (нужны логи!)</text>
  <text x="65" y="594" font-size="12" fill="#cbd5e1">• Нажми <tspan font-weight="bold" fill="#fde047">Deactivate</tspan> (отключи ключ) и</text>
  <text x="65" y="614" font-size="12" fill="#cbd5e1">  повесь временный Deny-всего.</text>
  <text x="65" y="636" font-size="12" fill="#cbd5e1">• Если скомпрометирована Role ➔</text>
  <text x="65" y="656" font-size="12" fill="#cbd5e1">  нажми <tspan font-weight="bold" fill="#34d399">Revoke active sessions</tspan></text>
  <text x="65" y="676" font-size="12" fill="#cbd5e1">  (ставит Deny по времени <tspan font-family="monospace">aws:TokenIssueTime</tspan>).</text>

  <rect x="425" y="524" width="350" height="196" rx="10" fill="#0d1424" stroke="#a855f7"/>
  <text x="445" y="550" font-size="13.5" font-weight="bold" fill="#c084fc">2. Расследовать (Investigation)</text>
  <text x="445" y="574" font-size="12" fill="#cbd5e1">• Открой CloudTrail LookupEvents</text>
  <text x="445" y="594" font-size="12" fill="#cbd5e1">  по фильтру <tspan font-family="monospace" fill="#fde047">AccessKeyId</tspan>.</text>
  <text x="445" y="616" font-size="12" fill="#cbd5e1">• Ищи признаки закрепления:</text>
  <text x="445" y="636" font-family="monospace" font-size="11" fill="#fca5a5">  CreateUser / CreateAccessKey</text>
  <text x="445" y="656" font-family="monospace" font-size="11" fill="#fca5a5">  AttachUserPolicy / RunInstances</text>
  <text x="445" y="676" font-size="12" fill="#cbd5e1">  (майнеры или создание бэкдор-админа!)</text>
  <text x="445" y="698" font-size="12" fill="#34d399">• Проверь ВСЕ регионы (us-east, ap-south)!</text>

  <rect x="805" y="524" width="350" height="196" rx="10" fill="#0d1424" stroke="#10b981"/>
  <text x="825" y="550" font-size="13.5" font-weight="bold" fill="#34d399">3. Вычистить и Усилить (Lessons)</text>
  <text x="825" y="574" font-size="12" fill="#cbd5e1">• Удалить все созданные хакером</text>
  <text x="825" y="594" font-size="12" fill="#cbd5e1">  ресурсы, ключи и EC2-инстансы.</text>
  <text x="825" y="616" font-size="12" fill="#cbd5e1">• Перевыпустить секреты приложений.</text>
  <text x="825" y="638" font-size="12" fill="#cbd5e1">• Внедрить Gitleaks в CI/CD, убрать</text>
  <text x="825" y="658" font-size="12" fill="#cbd5e1">  вечные ключи (перейти на IAM Roles +</text>
  <text x="825" y="678" font-size="12" fill="#cbd5e1">  OIDC) и включить MFA для всех юзеров.</text>
</svg>
