<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%" style="background-color:#0b0f19; font-family:'Segoe UI', Roboto, Arial, sans-serif;">
  <defs>
    <marker id="arrY" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#fbbf24"/></marker>
    <marker id="arrE" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#34d399"/></marker>
  </defs>

  <!-- Header -->
  <rect x="25" y="18" width="1150" height="78" rx="14" fill="#131b2e" stroke="#1e293b" stroke-width="2"/>
  <text x="50" y="52" font-size="22" font-weight="bold" fill="#fbbf24">🪣 ОБЛАЧНЫЕ ХРАНИЛИЩА (AWS S3 / AZURE BLOB) И ШИФРОВАНИЕ KMS</text>
  <text x="50" y="78" font-size="13.5" fill="#94a3b8">Почему 40% всех утечек данных происходят из-за открытых S3-бакетов и как работают 4 барьера защиты + Envelope Encryption</text>

  <!-- Top Left: 4 Layers of S3 Access Control -->
  <g transform="translate(25, 114)">
    <rect width="730" height="350" rx="12" fill="#111827" stroke="#f59e0b" stroke-width="2"/>
    <rect x="16" y="14" width="698" height="32" rx="7" fill="#d97706"/>
    <text x="365" y="35" font-size="14.5" font-weight="bold" fill="#ffffff" text-anchor="middle">1. ПУТЬ ЗАПРОСА К S3-БАКЕТУ: 4 УРОВНЯ ПРОВЕРКИ (АНАЛОГИЯ С БАНКОВСКИМ СЕЙФОМ)</text>

    <rect x="20" y="65" width="145" height="205" rx="10" fill="#1b1218" stroke="#ef4444"/>
    <text x="92" y="92" font-size="13" font-weight="bold" fill="#fca5a5" text-anchor="middle">Шлагбаум №1</text>
    <text x="92" y="114" font-size="12.5" font-weight="bold" fill="#fff" text-anchor="middle">Block Public</text>
    <text x="92" y="132" font-size="12.5" font-weight="bold" fill="#fff" text-anchor="middle">Access</text>
    <text x="92" y="160" font-size="11" fill="#cbd5e1" text-anchor="middle">Главный рубильник</text>
    <text x="92" y="176" font-size="11" fill="#cbd5e1" text-anchor="middle">на всём аккаунте!</text>
    <text x="92" y="200" font-size="11" fill="#34d399" text-anchor="middle">Перекрывает ошибки</text>
    <text x="92" y="216" font-size="11" fill="#34d399" text-anchor="middle">админов и ставит</text>
    <text x="92" y="232" font-size="11" fill="#34d399" text-anchor="middle">блок на мир 0.0.0.0</text>
    <text x="92" y="258" font-size="10.5" font-weight="bold" fill="#fde047" text-anchor="middle">ВКЛЮЧАТЬ ВСЕГДА!</text>

    <line x1="166" y1="167" x2="188" y2="167" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#arrY)"/>

    <rect x="192" y="65" width="155" height="205" rx="10" fill="#0f172a" stroke="#3b82f6"/>
    <text x="269" y="92" font-size="13" font-weight="bold" fill="#93c5fd" text-anchor="middle">Проверка №2</text>
    <text x="269" y="114" font-size="12.5" font-weight="bold" fill="#fff" text-anchor="middle">Bucket Policy</text>
    <text x="269" y="132" font-size="12.5" font-weight="bold" fill="#fff" text-anchor="middle">(Дверь сейфа)</text>
    <text x="269" y="160" font-size="11" fill="#cbd5e1" text-anchor="middle">JSON-правило</text>
    <text x="269" y="176" font-size="11" fill="#cbd5e1" text-anchor="middle">на самом бакете:</text>
    <text x="269" y="198" font-family="monospace" font-size="10.5" fill="#f87171" text-anchor="middle">Principal: "*"</text>
    <text x="269" y="216" font-size="10.5" fill="#f87171" text-anchor="middle">↑ ОПАСНО: вход</text>
    <text x="269" y="232" font-size="10.5" fill="#f87171" text-anchor="middle">для любого с улицы!</text>
    <text x="269" y="258" font-size="10.5" fill="#34d399" text-anchor="middle">+ Требуй HTTPS (TLS)</text>

    <line x1="348" y1="167" x2="370" y2="167" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#arrY)"/>

    <rect x="374" y="65" width="155" height="205" rx="10" fill="#0f172a" stroke="#8b5cf6"/>
    <text x="451" y="92" font-size="13" font-weight="bold" fill="#c4b5fd" text-anchor="middle">Проверка №3</text>
    <text x="451" y="114" font-size="12.5" font-weight="bold" fill="#fff" text-anchor="middle">IAM Policy</text>
    <text x="451" y="132" font-size="12.5" font-weight="bold" fill="#fff" text-anchor="middle">(Ключ юзера)</text>
    <text x="451" y="160" font-size="11" fill="#cbd5e1" text-anchor="middle">Разрешено ли этому</text>
    <text x="451" y="176" font-size="11" fill="#cbd5e1" text-anchor="middle">человеку/роли</text>
    <text x="451" y="194" font-size="11" fill="#cbd5e1" text-anchor="middle">читать файлы S3?</text>
    <text x="451" y="222" font-family="monospace" font-size="10.5" fill="#fde047" text-anchor="middle">s3:ListBucket</text>
    <text x="451" y="240" font-family="monospace" font-size="10.5" fill="#38bdf8" text-anchor="middle">s3:GetObject</text>

    <line x1="530" y1="167" x2="552" y2="167" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrE)"/>

    <rect x="556" y="65" width="154" height="205" rx="10" fill="#06281e" stroke="#10b981"/>
    <text x="633" y="92" font-size="13" font-weight="bold" fill="#6ee7b7" text-anchor="middle">Защита №4</text>
    <text x="633" y="114" font-size="12.5" font-weight="bold" fill="#fff" text-anchor="middle">Logging &amp;</text>
    <text x="633" y="132" font-size="12.5" font-weight="bold" fill="#fff" text-anchor="middle">Versioning</text>
    <text x="633" y="160" font-size="11" fill="#cbd5e1" text-anchor="middle">• Версионирование:</text>
    <text x="633" y="176" font-size="11" fill="#cbd5e1" text-anchor="middle">  спасает от шифрова-</text>
    <text x="633" y="192" font-size="11" fill="#cbd5e1" text-anchor="middle">  ния/удаления данных</text>
    <text x="633" y="216" font-size="11" fill="#cbd5e1" text-anchor="middle">• Логи доступа: кто</text>
    <text x="633" y="232" font-size="11" fill="#cbd5e1" text-anchor="middle">  и когда скачал файл</text>
    <text x="633" y="256" font-size="10.5" fill="#94a3b8" text-anchor="middle">(ACLs отключить!)</text>

    <rect x="20" y="286" width="690" height="48" rx="8" fill="#090d16" stroke="#334155"/>
    <text x="34" y="307" font-size="12" fill="#e2e8f0">🎯 Как проверяют публичный бакет в терминале (как в уровне 1 flAWS.cloud): <tspan font-family="monospace" fill="#fde047">aws s3 ls s3://имя-бакета --no-sign-request</tspan></text>
    <text x="34" y="325" font-size="11.5" fill="#94a3b8">В Microsoft Azure аналог: Azure Blob Storage (уровень доступа должен быть Private, а не Container/Blob!)</text>
  </g>

  <!-- Top Right: Real-world Misconfig Checklist -->
  <g transform="translate(775, 114)">
    <rect width="400" height="350" rx="12" fill="#181214" stroke="#ef4444" stroke-width="2"/>
    <rect x="14" y="14" width="372" height="32" rx="7" fill="#dc2626"/>
    <text x="200" y="35" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">2. ЧАСТЫЕ ОШИБКИ С ХРАНИЛИЩЕМ</text>

    <text x="20" y="74" font-size="13" font-weight="bold" fill="#fca5a5">❌ 1. «AuthenticatedUsers» в ACL</text>
    <text x="20" y="94" font-size="12" fill="#cbd5e1">Новички думают, что это «наши сотрудники».</text>
    <text x="20" y="112" font-size="12" fill="#f87171">НЕТ! Это ЛЮБОЙ человек с бесплатным</text>
    <text x="20" y="130" font-size="12" fill="#f87171">аккаунтом AWS по всему миру!</text>

    <text x="20" y="164" font-size="13" font-weight="bold" fill="#fca5a5">❌ 2. Разрешён HTTP без шифрования</text>
    <text x="20" y="184" font-size="12" fill="#cbd5e1">Если не поставить <tspan font-family="monospace" fill="#fde047">aws:SecureTransport: true</tspan></text>
    <text x="20" y="202" font-size="12" fill="#cbd5e1">в Deny-правиле, данные могут уйти по HTTP.</text>

    <text x="20" y="236" font-size="13" font-weight="bold" fill="#fca5a5">❌ 3. Бэкапы и .env в открытом бакете</text>
    <text x="20" y="256" font-size="12" fill="#cbd5e1">Часто сайт закрыт, а папка <tspan font-family="monospace" fill="#38bdf8">/backups/</tspan></text>
    <text x="20" y="274" font-size="12" fill="#cbd5e1">или статичный сайт в S3 отдаёт лишние файлы.</text>

    <text x="20" y="308" font-size="12.5" font-weight="bold" fill="#34d399">✔ В Azure защита аналогичная:</text>
    <text x="20" y="328" font-size="11.5" fill="#a7f3d0">allow_blob_public_access = false + SAS-токены с TTL</text>
  </g>

  <!-- Bottom Section: KMS Envelope Encryption -->
  <g transform="translate(25, 482)">
    <rect width="1150" height="258" rx="12" fill="#0d1424" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="16" y="14" width="1118" height="32" rx="7" fill="#7c3aed"/>
    <text x="575" y="35" font-size="14.5" font-weight="bold" fill="#ffffff" text-anchor="middle">3. КАК РАБОТАЕТ ШИФРОВАНИЕ KMS (ENVELOPE ENCRYPTION — АНАЛОГИЯ С КОНВЕРТОМ И СЕЙФОМ)</text>

    <rect x="24" y="64" width="245" height="172" rx="10" fill="#111827" stroke="#c084fc"/>
    <text x="146" y="88" font-size="13.5" font-weight="bold" fill="#d8b4fe" text-anchor="middle">Шаг 1. Главный ключ (KMS)</text>
    <text x="36" y="114" font-size="12" fill="#cbd5e1">В сейфе AWS KMS (или Azure</text>
    <text x="36" y="132" font-size="12" fill="#cbd5e1">Key Vault) лежит главный</text>
    <text x="36" y="150" font-size="12" fill="#cbd5e1">ключ <tspan font-weight="bold" fill="#fde047">CMK / KMS Key</tspan>.</text>
    <text x="36" y="176" font-size="11.5" fill="#34d399">Он НИКОГДА не покидает</text>
    <text x="36" y="194" font-size="11.5" fill="#34d399">криптомодуль HSM!</text>
    <text x="36" y="220" font-size="11" fill="#94a3b8">Но шифрует лишь мелкие ключи.</text>

    <line x1="272" y1="150" x2="306" y2="150" stroke="#c084fc" stroke-width="2.5" marker-end="url(#arrY)"/>

    <rect x="310" y="64" width="255" height="172" rx="10" fill="#111827" stroke="#38bdf8"/>
    <text x="437" y="88" font-size="13.5" font-weight="bold" fill="#7dd3fc" text-anchor="middle">Шаг 2. Одноразовый ключ (DEK)</text>
    <text x="322" y="114" font-size="12" fill="#cbd5e1">Для большого файла (10 ГБ)</text>
    <text x="322" y="132" font-size="12" fill="#cbd5e1">KMS создаёт <tspan font-weight="bold" fill="#38bdf8">Data Key (DEK)</tspan>:</text>
    <text x="322" y="154" font-size="12" fill="#cbd5e1">1) Открытую копию — для</text>
    <text x="322" y="172" font-size="12" fill="#cbd5e1">   быстрого шифрования файла.</text>
    <text x="322" y="192" font-size="12" fill="#cbd5e1">2) Зашифрованную копию DEK</text>
    <text x="322" y="210" font-size="12" fill="#cbd5e1">   кладут прямо рядом с файлом!</text>

    <line x1="568" y1="150" x2="602" y2="150" stroke="#c084fc" stroke-width="2.5" marker-end="url(#arrY)"/>

    <rect x="606" y="64" width="250" height="172" rx="10" fill="#111827" stroke="#10b981"/>
    <text x="731" y="88" font-size="13.5" font-weight="bold" fill="#6ee7b7" text-anchor="middle">Шаг 3. Двойная защита!</text>
    <text x="618" y="114" font-size="12" fill="#cbd5e1">Открытый ключ из памяти</text>
    <text x="618" y="132" font-size="12" fill="#cbd5e1">стирается. В S3 лежит:</text>
    <text x="618" y="156" font-size="12" fill="#fde047">[Шифр-Файл] + [Шифр-DEK]</text>
    <text x="618" y="182" font-size="11.5" fill="#cbd5e1">Даже если хакер украдёт</text>
    <text x="618" y="200" font-size="11.5" fill="#cbd5e1">файл, без прав на <tspan font-family="monospace" fill="#34d399">kms:Decrypt</tspan></text>
    <text x="618" y="218" font-size="11.5" fill="#34d399">он увидит лишь мусор!</text>

    <rect x="876" y="64" width="254" height="172" rx="10" fill="#090d16" stroke="#475569"/>
    <text x="1003" y="88" font-size="13" font-weight="bold" fill="#fbbf24" text-anchor="middle">3 режима в S3 (Важно!):</text>
    <text x="888" y="116" font-size="11.5" fill="#cbd5e1">• <tspan font-weight="bold">SSE-S3:</tspan> ключ у AWS (просто)</text>
    <text x="888" y="140" font-size="11.5" fill="#34d399">• <tspan font-weight="bold">SSE-KMS:</tspan> твой ключ в KMS</text>
    <text x="888" y="158" font-size="11" fill="#94a3b8">  + полный аудит кто открыл!</text>
    <text x="888" y="182" font-size="11.5" fill="#cbd5e1">• <tspan font-weight="bold">Client-Side:</tspan> шифруешь сам</text>
    <text x="888" y="200" font-size="11" fill="#94a3b8">  ещё до отправки в облако</text>
    <text x="888" y="222" font-size="11" fill="#fbbf24">📌 Пароль ≠ Ключ шифрования!</text>
  </g>
</svg>
